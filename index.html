<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registro Sessioni GdR</title>

<!-- PWA: rende l'app installabile sulla schermata Home -->
<meta name="theme-color" content="#1c1d1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sessioni GdR">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  :root{
    --bg:#1c1d1b;
    --surface:#26271f;
    --surface-2:#2f3027;
    --line:#3d3e33;
    --ink:#ece4d0;
    --ink-dim:#a9a693;
    --amber:#c08a3e;
    --amber-dim:#8f6a34;
    --green:#6f9169;
    --red:#b1584a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:1.35rem;letter-spacing:.2px;}
  header p{margin:4px 0 0;color:var(--ink-dim);font-size:.85rem;}

  nav{
    display:flex;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  nav button{
    flex:1;
    padding:12px 0;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-size:.85rem;
    font-family:Georgia,serif;
    letter-spacing:.3px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav button.active{color:var(--amber);border-bottom-color:var(--amber);}

  main{flex:1;padding:18px;padding-bottom:40px;}
  section{display:none;}
  section.active{display:block;}

  /* --- Timer card --- */
  .timer-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    margin-bottom:20px;
  }
  .timer-status{color:var(--ink-dim);font-size:.8rem;margin-bottom:6px;}
  .timer-clock{font-family:Georgia,serif;font-size:2.2rem;font-variant-numeric:tabular-nums;margin-bottom:14px;}
  .timer-game-input{
    width:100%;
    padding:11px 12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-size:.95rem;
    margin-bottom:14px;
  }
  .timer-game-input::placeholder{color:var(--ink-dim);}
  .btn{
    display:inline-block;
    width:100%;
    padding:13px 0;
    border-radius:8px;
    border:none;
    font-size:.95rem;
    font-weight:600;
    font-family:Georgia,serif;
    cursor:pointer;
  }
  .btn-start{background:var(--green);color:#12160f;}
  .btn-end{background:var(--red);color:#1a1210;}
  .btn-ghost{
    background:none;
    border:1px solid var(--amber-dim);
    color:var(--amber);
  }
  .btn:disabled{opacity:.4;}

  .active-game-tag{
    display:inline-block;
    background:var(--surface-2);
    border:1px solid var(--amber-dim);
    color:var(--amber);
    padding:4px 10px;
    border-radius:20px;
    font-size:.8rem;
    margin-bottom:10px;
  }

  /* --- Session list --- */
  .section-title{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .section-title h2{font-size:1rem;color:var(--ink-dim);font-weight:400;letter-spacing:.3px;}
  .add-link{color:var(--amber);font-size:.85rem;background:none;border:none;cursor:pointer;font-family:Georgia,serif;}

  .session{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .session-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .session-game{font-weight:600;font-size:.98rem;}
  .session-duration{color:var(--amber);font-size:.85rem;white-space:nowrap;}
  .session-meta{color:var(--ink-dim);font-size:.8rem;margin-top:3px;}
  .session-actions{display:flex;gap:14px;margin-top:10px;}
  .session-actions button{
    background:none;border:none;color:var(--ink-dim);
    font-size:.8rem;cursor:pointer;padding:0;
    text-decoration:underline;text-underline-offset:2px;
  }
  .session-actions button.danger{color:var(--red);}

  .empty{color:var(--ink-dim);font-size:.85rem;text-align:center;padding:30px 10px;}

  .filter-bar{display:flex;gap:8px;margin-bottom:14px;}
  .filter-input{
    flex:1;padding:10px 12px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font-size:.88rem;
  }
  .filter-input::placeholder{color:var(--ink-dim);}
  .filter-select{
    padding:10px 8px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;color:var(--ink-dim);font-size:.8rem;max-width:135px;
  }

  /* --- Edit form (inline) --- */
  .edit-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  .edit-form .full{grid-column:1/3;}
  .edit-form label{display:block;font-size:.7rem;color:var(--ink-dim);margin-bottom:3px;}
  .edit-form input{
    width:100%;padding:8px 9px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:.85rem;
  }
  .edit-form-actions{grid-column:1/3;display:flex;gap:10px;margin-top:4px;}
  .edit-form-actions .btn{padding:9px 0;font-size:.85rem;}

  /* --- Stats --- */
  .stat-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .stat-tabs button{
    flex:1;padding:8px 0;border-radius:7px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-dim);font-size:.78rem;cursor:pointer;
  }
  .stat-tabs button.active{border-color:var(--amber);color:var(--amber);}
  .stat-hero{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 18px;text-align:center;margin-bottom:14px;
  }
  .stat-hero .big{font-family:Georgia,serif;font-size:2.4rem;color:var(--amber);}
  .stat-hero .label{color:var(--ink-dim);font-size:.8rem;margin-top:2px;}
  .stat-sub{color:var(--ink-dim);font-size:.78rem;margin-top:8px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-label{width:90px;font-size:.78rem;color:var(--ink-dim);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--amber);}
  .bar-val{width:48px;text-align:right;font-size:.75rem;color:var(--ink-dim);flex-shrink:0;}

  .stat-block{margin-bottom:22px;}
  .stat-block h3{font-size:.85rem;color:var(--ink-dim);font-weight:400;margin-bottom:10px;letter-spacing:.3px;}

  .backup-block{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  }
  .backup-block h3{font-size:.85rem;color:var(--ink-dim);font-weight:400;margin-bottom:6px;letter-spacing:.3px;}
  .backup-hint{color:var(--ink-dim);font-size:.78rem;line-height:1.4;margin:0 0 12px;}
  .backup-actions{display:flex;gap:10px;}
  .backup-actions .btn{flex:1;padding:10px 0;font-size:.82rem;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);border:1px solid var(--amber-dim);color:var(--ink);
    padding:10px 18px;border-radius:20px;font-size:.82rem;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    max-width:88%;text-align:center;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Registro Sessioni</h1>
    <p>Traccia le tue partite di ruolo</p>
  </header>

  <nav>
    <button class="tab-btn active" data-tab="timer">Sessione</button>
    <button class="tab-btn" data-tab="log">Registro</button>
    <button class="tab-btn" data-tab="stats">Statistiche</button>
  </nav>

  <main>
    <datalist id="gameList"></datalist>

    <!-- TIMER TAB -->
    <section id="tab-timer" class="active">
      <div class="timer-card" id="timerCard"></div>

      <div class="section-title">
        <h2>Ultime sessioni</h2>
      </div>
      <div id="recentList"></div>
    </section>

    <!-- LOG TAB -->
    <section id="tab-log">
      <div class="section-title">
        <h2>Tutte le sessioni</h2>
        <button class="add-link" id="addManualBtn">+ aggiungi</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" class="filter-input" placeholder="Cerca per gioco…">
        <select id="periodFilter" class="filter-select">
          <option value="all">Tutti i periodi</option>
          <option value="7d">Ultimi 7 giorni</option>
          <option value="30d">Ultimo mese</option>
          <option value="365d">Ultimo anno</option>
        </select>
      </div>

      <div id="addForm" style="display:none;margin-bottom:14px;"></div>
      <div id="fullList"></div>

      <div class="backup-block">
        <h3>Backup dati</h3>
        <p class="backup-hint">I dati sono salvati sul telefono. Esporta un file di backup ogni tanto per non perderli in caso di reset o disinstallazione.</p>
        <div class="backup-actions">
          <button class="btn btn-ghost" id="exportBtn">Esporta backup</button>
          <button class="btn btn-ghost" id="importBtn">Importa backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </section>

    <!-- STATS TAB -->
    <section id="tab-stats">
      <div class="stat-tabs">
        <button class="stat-btn active" data-range="day">Giorno</button>
        <button class="stat-btn" data-range="week">Settimana</button>
        <button class="stat-btn" data-range="month">Mese</button>
        <button class="stat-btn" data-range="year">Anno</button>
      </div>
      <div id="statsContent"></div>
    </section>
  </main>
</div>

<script>
let sessions = [];
let activeSession = null; // {game, startISO}
let timerInterval = null;
let editingId = null;

// ---------- Database (IndexedDB, salvato sul dispositivo) ----------
const DB_NAME = 'gdrSessionsDB';
const DB_VERSION = 1;
let dbInstance = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', {keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'key'});
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
}
async function getDB(){
  if(!dbInstance) dbInstance = await openDB();
  return dbInstance;
}
async function loadData(){
  try{
    const db = await getDB();
    sessions = await new Promise((resolve,reject)=>{
      const tx = db.transaction('sessions','readonly');
      const req = tx.objectStore('sessions').getAll();
      req.onsuccess = ()=> resolve(req.result||[]);
      req.onerror = ()=> reject(req.error);
    });
    const activeRow = await new Promise((resolve,reject)=>{
      const tx = db.transaction('meta','readonly');
      const req = tx.objectStore('meta').get('active');
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    activeSession = activeRow ? activeRow.value : null;
  }catch(e){
    console.error('Errore apertura database, uso dati vuoti', e);
    sessions = []; activeSession = null;
  }
}
async function saveSessions(){
  try{
    const db = await getDB();
    const tx = db.transaction('sessions','readwrite');
    const store = tx.objectStore('sessions');
    store.clear();
    sessions.forEach(s=> store.put(s));
    await new Promise((resolve,reject)=>{
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
    await maybeAutoBackup();
  }catch(e){ console.error('Salvataggio sessioni fallito', e); }
}
async function maybeAutoBackup(){
  try{
    const db = await getDB();
    const tx = db.transaction('meta','readwrite');
    const store = tx.objectStore('meta');
    const row = await new Promise((resolve,reject)=>{
      const req = store.get('sessionsSinceBackup');
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    const count = ((row && row.value) || 0) + 1;
    if(count >= 2){
      store.put({key:'sessionsSinceBackup', value:0});
      await new Promise((resolve,reject)=>{ tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error); });
      exportBackup(true);
    } else {
      store.put({key:'sessionsSinceBackup', value:count});
      await new Promise((resolve,reject)=>{ tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error); });
    }
  }catch(e){ console.error('Auto-backup check fallito', e); }
}
async function saveActive(){
  try{
    const db = await getDB();
    const tx = db.transaction('meta','readwrite');
    const store = tx.objectStore('meta');
    if(activeSession) store.put({key:'active', value:activeSession});
    else store.delete('active');
    return new Promise((resolve,reject)=>{
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ console.error('Salvataggio sessione attiva fallito', e); }
}

// ---------- Backup: esporta / importa ----------
function exportBackup(isAuto){
  const payload = {
    exportedAt: new Date().toISOString(),
    sessions,
    activeSession
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = fmtDateISO(new Date());
  a.href = url;
  a.download = `backup-sessioni-gdr-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  if(isAuto) showToast('Backup automatico scaricato');
}
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data.sessions) ? data.sessions : [];
      if(incoming.length===0){ alert('Il file non contiene sessioni valide.'); return; }
      const existingIds = new Set(sessions.map(s=>s.id));
      let added = 0, skipped = 0;
      incoming.forEach(s=>{
        if(!s.id || !s.game || !s.date || !s.startTime || !s.endTime) return;
        if(existingIds.has(s.id)){ skipped++; return; }
        sessions.push({id:s.id, game:s.game, date:s.date, startTime:s.startTime, endTime:s.endTime});
        existingIds.add(s.id);
        added++;
      });
      await saveSessions();
      renderAll();
      alert(`Importazione completata: ${added} session${added===1?'e aggiunta':'i aggiunte'}${skipped?`, ${skipped} già presenti (ignorate)`:''}.`);
    }catch(err){
      alert('File di backup non valido.');
    }
  };
  reader.readAsText(file);
}

// ---------- Helpers ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n.toString().padStart(2,'0'); }
function fmtDateISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtTimeISO(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDateReadable(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'});
}
function minutesToLabel(mins){
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h===0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}
function sessionDurationMinutes(s){
  const start = new Date(s.date+'T'+s.startTime+':00');
  let end = new Date(s.date+'T'+s.endTime+':00');
  if(end < start) end.setDate(end.getDate()+1); // sessione oltre mezzanotte
  return (end-start)/60000;
}

// ---------- Render: Timer tab ----------
function renderTimerCard(){
  const el = document.getElementById('timerCard');
  if(!activeSession){
    el.innerHTML = `
      <div class="timer-status">Nessuna sessione attiva</div>
      <div class="timer-clock">00:00:00</div>
      <input class="timer-game-input" id="gameInput" list="gameList" placeholder="Nome del gioco (es. Call of Cthulhu)">
      <button class="btn btn-start" id="startBtn">Avvia sessione</button>
    `;
    document.getElementById('startBtn').onclick = startSession;
  } else {
    el.innerHTML = `
      <div class="timer-status">Sessione in corso</div>
      <div class="active-game-tag">${escapeHtml(activeSession.game)}</div>
      <div class="timer-clock" id="liveClock">00:00:00</div>
      <button class="btn btn-end" id="endBtn">Termina sessione</button>
    `;
    document.getElementById('endBtn').onclick = endSession;
    tickClock();
    clearInterval(timerInterval);
    timerInterval = setInterval(tickClock, 1000);
  }
}
function tickClock(){
  if(!activeSession) return;
  const start = new Date(activeSession.startISO);
  const diff = Math.max(0, Date.now()-start.getTime());
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const clockEl = document.getElementById('liveClock');
  if(clockEl) clockEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
}
async function startSession(){
  const input = document.getElementById('gameInput');
  const game = (input.value||'').trim() || 'Sessione senza nome';
  activeSession = { game, startISO: new Date().toISOString() };
  await saveActive();
  renderTimerCard();
}
async function endSession(){
  const start = new Date(activeSession.startISO);
  const end = new Date();
  const newSession = {
    id: uid(),
    game: activeSession.game,
    date: fmtDateISO(start),
    startTime: fmtTimeISO(start),
    endTime: fmtTimeISO(end)
  };
  sessions.unshift(newSession);
  activeSession = null;
  await saveSessions();
  await saveActive();
  clearInterval(timerInterval);
  renderAll();
}
function renderRecentList(){
  const el = document.getElementById('recentList');
  const recent = sessions.slice(0,4);
  if(recent.length===0){ el.innerHTML = '<div class="empty">Ancora nessuna sessione registrata.</div>'; return; }
  el.innerHTML = recent.map(s=>sessionCardHtml(s)).join('');
  bindSessionCardEvents(el);
}

// ---------- Render: Log tab ----------
let searchQuery = '';
let periodFilter = 'all';

function renderFullList(){
  const el = document.getElementById('fullList');
  let filtered = [...sessions];

  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(s=> s.game.toLowerCase().includes(q));
  }
  if(periodFilter !== 'all'){
    const days = {'7d':7,'30d':30,'365d':365}[periodFilter];
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate()-days);
    filtered = filtered.filter(s=> new Date(s.date+'T00:00:00') >= cutoff);
  }

  if(sessions.length===0){ el.innerHTML = '<div class="empty">Nessuna sessione ancora. Aggiungine una manualmente o avvia il timer.</div>'; return; }
  if(filtered.length===0){ el.innerHTML = '<div class="empty">Nessuna sessione corrisponde alla ricerca.</div>'; return; }

  const sorted = filtered.sort((a,b)=> (b.date+b.startTime).localeCompare(a.date+a.startTime));
  el.innerHTML = sorted.map(s=>sessionCardHtml(s)).join('');
  bindSessionCardEvents(el);
}
function sessionCardHtml(s){
  const mins = sessionDurationMinutes(s);
  if(editingId === s.id){
    return `<div class="session" data-id="${s.id}">${editFormHtml(s)}</div>`;
  }
  return `
    <div class="session" data-id="${s.id}">
      <div class="session-row">
        <div>
          <div class="session-game">${escapeHtml(s.game)}</div>
          <div class="session-meta">${fmtDateReadable(s.date)} · ${s.startTime}–${s.endTime}</div>
        </div>
        <div class="session-duration">${minutesToLabel(mins)}</div>
      </div>
      <div class="session-actions">
        <button class="edit-btn" data-id="${s.id}">modifica</button>
        <button class="danger delete-btn" data-id="${s.id}">elimina</button>
      </div>
    </div>
  `;
}
function editFormHtml(s){
  return `
    <div class="edit-form">
      <div class="full">
        <label>Gioco</label>
        <input type="text" class="ef-game" list="gameList" value="${escapeAttr(s.game)}">
      </div>
      <div>
        <label>Data</label>
        <input type="date" class="ef-date" value="${s.date}">
      </div>
      <div></div>
      <div>
        <label>Inizio</label>
        <input type="time" class="ef-start" value="${s.startTime}">
      </div>
      <div>
        <label>Fine</label>
        <input type="time" class="ef-end" value="${s.endTime}">
      </div>
      <div class="edit-form-actions">
        <button class="btn btn-ghost save-btn" data-id="${s.id}" style="flex:1;">Salva</button>
        <button class="btn btn-ghost cancel-btn" style="flex:1;color:var(--ink-dim);border-color:var(--line);">Annulla</button>
      </div>
    </div>
  `;
}
function bindSessionCardEvents(container){
  container.querySelectorAll('.edit-btn').forEach(b=>{
    b.onclick = ()=>{ editingId = b.dataset.id; renderAll(); };
  });
  container.querySelectorAll('.delete-btn').forEach(b=>{
    b.onclick = async ()=>{
      sessions = sessions.filter(s=>s.id!==b.dataset.id);
      await saveSessions();
      renderAll();
    };
  });
  container.querySelectorAll('.save-btn').forEach(b=>{
    b.onclick = async ()=>{
      const card = b.closest('.session');
      const s = sessions.find(x=>x.id===b.dataset.id);
      s.game = card.querySelector('.ef-game').value.trim() || s.game;
      s.date = card.querySelector('.ef-date').value || s.date;
      s.startTime = card.querySelector('.ef-start').value || s.startTime;
      s.endTime = card.querySelector('.ef-end').value || s.endTime;
      editingId = null;
      await saveSessions();
      renderAll();
    };
  });
  container.querySelectorAll('.cancel-btn').forEach(b=>{
    b.onclick = ()=>{ editingId = null; renderAll(); };
  });
}

  const el = document.getElementById('addForm');

    el.innerHTML = `
      <div class="session">
        <div class="edit-form">
          <div class="full">
            <label>Gioco</label>
            <input type="text" id="new-game" list="gameList" placeholder="Nome del gioco">
          </div>
          <div>
            <label>Data</label>
            <input type="date" id="new-date" value="${fmtDateISO(now)}">
          </div>
          <div></div>
          <div>
            <label>Inizio</label>
            <input type="time" id="new-start" value="${fmtTimeISO(now)}">
          </div>
          <div>
            <label>Fine</label>
            <input type="time" id="new-end" value="${fmtTimeISO(now)}">
          </div>
          <div class="edit-form-actions">
            <button class="btn btn-start" id="new-save" style="flex:1;">Aggiungi</button>
            <button class="btn btn-ghost" id="new-cancel" style="flex:1;color:var(--ink-dim);border-color:var(--line);">Annulla</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('new-save').onclick = async ()=>{
      const game = document.getElementById('new-game').value.trim();
      if(!game){ document.getElementById('new-game').focus(); return; }
      sessions.unshift({
        id: uid(),
        game,
        date: document.getElementById('new-date').value,
        startTime: document.getElementById('new-start').value,
        endTime: document.getElementById('new-end').value
      });
      await saveSessions();
      el.style.display = 'none';
      renderAll();
    };
    document.getElementById('new-cancel').onclick = ()=>{ el.style.display='none'; el.innerHTML=''; };
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
});

// ---------- Stats ----------
let currentRange = 'day';
function rangeBounds(range){
  const now = new Date();
  let start;
  if(range==='day'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  } else if(range==='week'){
    const day = (now.getDay()+6)%7; // lunedì=0
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-day);
  } else if(range==='month'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  } else {
    start = new Date(now.getFullYear(), 0, 1);
  }
  return {start, end: now};
}
function renderStats(){
  const {start} = rangeBounds(currentRange);
  const inRange = sessions.filter(s=>{
    const d = new Date(s.date+'T00:00:00');
    return d >= start;
  });
  const totalMins = inRange.reduce((sum,s)=>sum+sessionDurationMinutes(s),0);

  const byGame = {};
  inRange.forEach(s=>{
    byGame[s.game] = (byGame[s.game]||0) + sessionDurationMinutes(s);
  });
  const gameEntries = Object.entries(byGame).sort((a,b)=>b[1]-a[1]);
  const maxGame = gameEntries.length? gameEntries[0][1] : 1;

  const rangeLabels = {day:'oggi', week:'questa settimana', month:'questo mese', year:"quest'anno"};

  let barsHtml = '';
  if(gameEntries.length===0){
    barsHtml = '<div class="empty">Nessuna sessione in questo periodo.</div>';
  } else {
    barsHtml = gameEntries.map(([game,mins])=>`
      <div class="bar-row">
        <div class="bar-label">${escapeHtml(game)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(mins/maxGame*100)}%"></div></div>
        <div class="bar-val">${minutesToLabel(mins)}</div>
      </div>
    `).join('');
  }

  document.getElementById('statsContent').innerHTML = `
    <div class="stat-hero">
      <div class="big">${minutesToLabel(totalMins)}</div>
      <div class="label">giocate ${rangeLabels[currentRange]}</div>
      <div class="stat-sub">${inRange.length} session${inRange.length===1?'e':'i'}</div>
    </div>
    <div class="stat-block">
      <h3>Andamento</h3>
      ${trendChartHtml()}
    </div>
    <div class="stat-block">
      <h3>Per gioco</h3>
      ${barsHtml}
    </div>
  `;
}

// ---------- Grafico andamento nel tempo ----------
function trendBuckets(){
  // restituisce [{label, mins}] in ordine cronologico, a seconda del range corrente
  const now = new Date();
  const buckets = [];
  if(currentRange==='day'){
    for(let i=6;i>=0;i--){
      const d = new Date(now); d.setDate(d.getDate()-i);
      const iso = fmtDateISO(d);
      buckets.push({label:d.toLocaleDateString('it-IT',{weekday:'short'}).slice(0,3), test:s=>s.date===iso});
    }
  } else if(currentRange==='week'){
    for(let i=7;i>=0;i--){
      const wStart = new Date(now); wStart.setDate(wStart.getDate()-(wStart.getDay()+6)%7-7*i);
      const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate()+6);
      buckets.push({label:wStart.getDate()+'/'+(wStart.getMonth()+1), test:s=>{
        const d = new Date(s.date+'T00:00:00'); return d>=wStart && d<=wEnd;
      }});
    }
  } else if(currentRange==='month'){
    for(let i=5;i>=0;i--){
      const m = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const mEnd = new Date(now.getFullYear(), now.getMonth()-i+1, 0);
      buckets.push({label:m.toLocaleDateString('it-IT',{month:'short'}), test:s=>{
        const d = new Date(s.date+'T00:00:00'); return d>=m && d<=mEnd;
      }});
    }
  } else {
    for(let i=4;i>=0;i--){
      const y = now.getFullYear()-i;
      buckets.push({label:String(y), test:s=> new Date(s.date+'T00:00:00').getFullYear()===y});
    }
  }
  buckets.forEach(b=>{
    b.mins = sessions.filter(b.test).reduce((sum,s)=>sum+sessionDurationMinutes(s),0);
  });
  return buckets;
}
function trendChartHtml(){
  const buckets = trendBuckets();
  const max = Math.max(1, ...buckets.map(b=>b.mins));
  const w = 320, h = 110, padBottom = 20, barGap = 8;
  const barW = (w - barGap*(buckets.length-1)) / buckets.length;
  let bars = '';
  buckets.forEach((b,i)=>{
    const barH = (b.mins/max) * (h-padBottom-10);
    const x = i*(barW+barGap);
    const y = h - padBottom - barH;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="var(--amber, #c08a3e)"></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="#a9a693">${escapeHtml(b.label)}</text>`;
  });
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible;">
      ${bars}
    </svg>
  `;
}

    renderStats();

// ---------- Utils ----------
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

// ---------- Lista giochi (autocomplete) ----------
function renderGameList(){
  // giochi unici, ordinati dal più usato di recente
  const seen = new Map();
  [...sessions]
    .sort((a,b)=> (b.date+b.startTime).localeCompare(a.date+a.startTime))
    .forEach(s=>{ if(!seen.has(s.game)) seen.set(s.game, true); });
  const el = document.getElementById('gameList');
  el.innerHTML = [...seen.keys()].map(g=>`<option value="${escapeAttr(g)}"></option>`).join('');
}

// ---------- Master render ----------
function renderAll(){
  renderGameList();
  renderTimerCard();
  renderRecentList();
  renderFullList();
  renderStats();
}

// ---------- PWA setup: registra il service worker statico (sw.js) ----------
function setupPWA(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

(async function init(){
  setupPWA();
  await loadData();
  renderAll();
})();
</script>
